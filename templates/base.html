<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block titulo %}Rê Acessórios — Financeiro{% endblock %}</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='icone-192.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icone-192.png') }}">
<meta name="theme-color" content="#C2293C">
<style>
  :root {
    --rosa: #EBB3D6;
    --carmim: #C2293C;
    --carmim-escuro: #8D0E23;
    --fundo: #FAF6F7;
    --texto: #3A2A2E;
    --branco: #FFFFFF;
    --cinza: #E8E0E2;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
  }
  .app { display: flex; min-height: 100vh; }
  .lateral {
    width: 220px;
    background: var(--carmim-escuro);
    color: var(--branco);
    padding: 24px 0;
    flex-shrink: 0;
  }
  .lateral h1 {
    font-size: 1.1rem;
    margin: 0 24px 24px;
    color: var(--rosa);
  }
  .lateral a {
    display: block;
    padding: 10px 24px;
    color: var(--branco);
    text-decoration: none;
    font-size: 0.95rem;
  }
  .lateral a:hover, .lateral a.ativo { background: var(--carmim); }
  .conteudo { flex: 1; padding: 32px; max-width: 1000px; }
  h2 { color: var(--carmim-escuro); }
  a { color: var(--carmim); }
  table { width: 100%; border-collapse: collapse; background: var(--branco); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--cinza); font-size: 0.92rem; }
  th { background: var(--rosa); color: var(--carmim-escuro); }
  .card {
    background: var(--branco);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .grid-resumo { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .stat { background: var(--branco); border-radius: 10px; padding: 18px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .stat .valor { font-size: 1.6rem; font-weight: 700; color: var(--carmim-escuro); }
  .stat .rotulo { font-size: 0.85rem; color: #777; margin-top: 4px; }
  .btn {
    display: inline-block;
    background: var(--carmim);
    color: var(--branco);
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn:hover { background: var(--carmim-escuro); }
  .btn-secundario { background: var(--cinza); color: var(--texto); }
  .btn-zap { background: #25D366; }
  form.inline { display: inline; }
  input, select { padding: 7px 10px; border: 1px solid var(--cinza); border-radius: 6px; font-size: 0.9rem; }
  label { display: block; font-size: 0.85rem; margin: 10px 0 4px; color: #666; }
  .flash { padding: 10px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 0.9rem; }
  .flash.ok { background: #E3F5E8; color: #1F7A3E; }
  .flash.erro { background: #FBE3E3; color: var(--carmim-escuro); }
  .atraso { color: var(--carmim); font-weight: 600; }
  .saldo-zero { color: #1F7A3E; }

  /* Autocomplete "na mão" (cliente/produto em Nova venda, Nova compra e Editar
     compra) — substitui o <datalist> nativo, que não dá pra ensinar a ignorar
     acento. O campo de texto normal fica dentro desse wrapper, com o dropdown
     de sugestões logo abaixo. */
  .campo-autocomplete { position: relative; display: inline-block; }
  .campo-autocomplete input { display: block; }
  .autocomplete-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    max-height: 260px;
    overflow-y: auto;
    background: var(--branco);
    border: 1px solid var(--cinza);
    border-top: none;
    border-radius: 0 0 8px 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    z-index: 20;
  }
  .autocomplete-opcao { padding: 8px 12px; font-size: 0.88rem; cursor: pointer; }
  .autocomplete-opcao:hover, .autocomplete-opcao.ativa { background: var(--fundo); }

  /* Celular: a barra lateral fixa de 220px e os campos com largura fixa em pixel
     cortavam conteúdo em tela pequena. Aqui vira barra de cima, rolável, e os
     campos de formulário passam a ocupar a largura disponível. */
  @media (max-width: 768px) {
    .app { flex-direction: column; min-height: auto; }
    .lateral {
      width: 100%;
      padding: 10px 0;
      display: flex;
      align-items: center;
      overflow-x: auto;
      white-space: nowrap;
    }
    .lateral h1 { font-size: 0.85rem; margin: 0 12px; white-space: nowrap; }
    .lateral a { display: inline-block; padding: 8px 12px; font-size: 0.85rem; }
    .conteudo { padding: 14px; max-width: 100%; }
    table { display: block; overflow-x: auto; white-space: nowrap; }
    input, select { max-width: 100%; }
    .card input[type="text"], .card input[type="date"], .card input[type="number"] {
      width: 100% !important;
      box-sizing: border-box;
    }
    .card { padding: 14px; }
    .campo-autocomplete { display: block; width: 100%; }
  }
</style>
</head>
<body>
<script>
// ATENÇÃO: este bloco fica ANTES do bloco de conteúdo das telas filhas, de
// propósito — as telas filhas (vendas.html, clientes.html etc.) chamam essas
// funções no próprio script delas, dentro do bloco de conteúdo. Se essas
// definições ficassem depois (como já esteve, por engano), a chamada roda
// antes da função existir e quebra com "ReferenceError" silencioso — nenhuma
// máscara nem autocomplete funciona, sem erro visível na tela, só no console.

// Gera uma caixinha de data por parcela — padrão 30 dias entre uma e outra,
// mas cada uma continua editável na mão depois de gerada. Só regenera quando
// o número de parcelas muda, pra não apagar data que o Thiago já ajustou.
function _valorParaNumero(texto) {
  return parseFloat((texto || "0").replace(",", ".")) || 0;
}

// Preenche o valor sugerido de cada parcela — o total menos a entrada (se tiver),
// dividido em partes iguais entre as parcelas restantes. Já vem pronto no campo,
// mas o Thiago pode editar cada um na mão (ex.: pra não ficar uma dízima tipo
// 33,33 — ele ajusta pra 33/33/34 e fecha certinho). Chama de novo sempre que o
// valor total, a entrada ou o número de parcelas mudam — reaplicando a sugestão.
function atualizarValoresParcelas(idContainer, idValorTotal, idEntrada) {
  const container = document.getElementById(idContainer);
  if (!container) return;
  const linhas = container.querySelectorAll(".linha-parcela");
  if (linhas.length === 0) return;
  const total = _valorParaNumero(document.getElementById(idValorTotal).value);
  const entrada = idEntrada && document.getElementById(idEntrada) ? _valorParaNumero(document.getElementById(idEntrada).value) : 0;
  const restante = Math.max(0, total - entrada);
  const valorCada = restante / linhas.length;
  linhas.forEach(linha => {
    const input = linha.querySelector(".valor-parcela-input");
    if (input) input.value = valorCada.toFixed(2).replace(".", ",");
  });
}

// ---------- Vários produtos numa mesma venda/compra — cada um com seu próprio
// autocomplete e valor; o total e a descrição final somam/juntam tudo sozinhos. ----------
let _contadorItemProduto = 0;

function _criarBlocoItemProduto(container, itens, aoMudar) {
  const id = ++_contadorItemProduto;
  const bloco = document.createElement("div");
  bloco.className = "bloco-item-produto";
  bloco.style.cssText = "margin-bottom:10px; padding-bottom:10px; border-bottom:1px dashed var(--cinza);";
  bloco.innerHTML = `
    <div class="campo-autocomplete" style="width:400px;">
      <input type="text" id="item-produto-${id}" autocomplete="off" style="width:400px" placeholder="Busque por nome, código ou marca do catálogo (sem acento já acha), ou digite livre">
      <div class="autocomplete-dropdown" id="item-dropdown-${id}"></div>
    </div>
    <input type="hidden" id="item-descricao-${id}" data-papel="descricao">
    <div style="margin:4px 0 0;">
      <button type="button" id="item-toggle-novo-${id}" class="btn btn-secundario" style="font-size:0.8rem; padding:5px 10px;">Não achei o produto — cadastrar novo</button>
    </div>
    <div id="item-form-novo-${id}" style="display:none; background:var(--branco); border-radius:8px; padding:12px; margin-top:8px;">
      <label>Código (opcional — se deixar em branco, geramos um)</label>
      <input type="text" id="item-codigo-novo-${id}" style="width:160px" placeholder="ex.: AD010">
      <label>Nome do produto</label>
      <input type="text" id="item-nome-novo-${id}" style="width:300px">
      <label>Marca</label>
      <input type="text" id="item-marca-novo-${id}" style="width:200px">
      <label>Preço de venda (R$)</label>
      <input type="text" id="item-preco-novo-${id}" style="width:120px" placeholder="300,00">
      <div style="margin-top:10px;">
        <button type="button" class="btn" id="item-salvar-novo-${id}">Salvar produto</button>
        <span id="item-msg-novo-${id}" style="font-size:0.85rem; margin-left:10px;"></span>
      </div>
    </div>
    <label>Valor deste produto (R$)</label>
    <input type="text" id="item-valor-${id}" data-papel="valor" placeholder="300,00" style="width:120px">
    <button type="button" id="item-remover-${id}" style="margin-left:10px; background:none; border:none; color:var(--carmim); cursor:pointer; font-size:0.85rem;">✕ remover produto</button>
  `;
  container.appendChild(bloco); // precisa estar na página antes de buscar os ids por dentro

  inicializarSeletorProduto({
    produto: `item-produto-${id}`,
    dropdown: `item-dropdown-${id}`,
    itens: itens,
    descricao: `item-descricao-${id}`,
    valor: `item-valor-${id}`,
    toggleNovo: `item-toggle-novo-${id}`,
    formNovo: `item-form-novo-${id}`,
    codigoNovo: `item-codigo-novo-${id}`,
    nomeNovo: `item-nome-novo-${id}`,
    marcaNovo: `item-marca-novo-${id}`,
    precoNovo: `item-preco-novo-${id}`,
    salvarNovo: `item-salvar-novo-${id}`,
    msgNovo: `item-msg-novo-${id}`,
  });

  document.getElementById(`item-produto-${id}`).addEventListener("input", aoMudar);
  document.getElementById(`item-valor-${id}`).addEventListener("input", aoMudar);
  bloco.querySelector(`#item-remover-${id}`).addEventListener("click", () => {
    bloco.remove();
    aoMudar();
  });

  return bloco;
}

// cfg = { containerItens, btnAdicionar, itens, idDescricaoFinal, idValorFinal }
function inicializarMultiProduto(cfg) {
  const container = document.getElementById(cfg.containerItens);

  function recalcular() {
    let soma = 0;
    const partes = [];
    container.querySelectorAll(".bloco-item-produto").forEach(bloco => {
      const desc = bloco.querySelector('[data-papel="descricao"]');
      const valor = bloco.querySelector('[data-papel="valor"]');
      if (desc && desc.value.trim()) {
        partes.push(desc.value.trim());
        soma += _valorParaNumero(valor.value);
      }
    });
    const campoValorFinal = document.getElementById(cfg.idValorFinal);
    const campoDescricaoFinal = document.getElementById(cfg.idDescricaoFinal);
    campoValorFinal.value = soma > 0 ? soma.toFixed(2).replace(".", ",") : "";
    campoDescricaoFinal.value = partes.join("; ");
    campoValorFinal.dispatchEvent(new Event("input", { bubbles: true }));
  }

  function adicionarItem() {
    _criarBlocoItemProduto(container, cfg.itens, recalcular);
  }

  document.getElementById(cfg.btnAdicionar).addEventListener("click", adicionarItem);
  adicionarItem();
}

// Quando o Thiago muda a data de uma parcela, as parcelas seguintes (as "de baixo")
// se ajustam sozinhas mantendo o intervalo de 30 dias a partir dessa nova data —
// evita ter que corrigir uma por uma quando só a primeira mudou.
function _cascatearDatasParcelas(idContainer, indiceAlterado) {
  const container = document.getElementById(idContainer);
  const inputs = [...container.querySelectorAll("input[type='date']")];
  const base = inputs[indiceAlterado];
  if (!base || !base.value) return;
  const dataBase = new Date(base.value + "T00:00:00");
  for (let i = indiceAlterado + 1; i < inputs.length; i++) {
    const d = new Date(dataBase);
    d.setDate(d.getDate() + 30 * (i - indiceAlterado));
    inputs[i].value = d.toISOString().slice(0, 10);
  }
}

// Quando o Thiago edita o valor de uma parcela na mão (ex.: pra fechar um número
// redondo em vez de dízima), as parcelas seguintes dividem o que sobrou entre elas
// — mesma lógica da cascata de datas, mas pro valor.
function _cascatearValoresParcelas(idContainer, idValorTotal, idEntrada, indiceAlterado) {
  const container = document.getElementById(idContainer);
  const inputs = [...container.querySelectorAll(".valor-parcela-input")];
  const restantesDepois = inputs.length - 1 - indiceAlterado;
  if (restantesDepois <= 0) return;
  const total = _valorParaNumero(document.getElementById(idValorTotal).value);
  const entrada = idEntrada && document.getElementById(idEntrada) ? _valorParaNumero(document.getElementById(idEntrada).value) : 0;
  const restanteGeral = Math.max(0, total - entrada);
  let somaFixada = 0;
  for (let i = 0; i <= indiceAlterado; i++) {
    somaFixada += _valorParaNumero(inputs[i].value);
  }
  const sobra = Math.max(0, restanteGeral - somaFixada);
  const valorCada = sobra / restantesDepois;
  for (let i = indiceAlterado + 1; i < inputs.length; i++) {
    inputs[i].value = valorCada.toFixed(2).replace(".", ",");
  }
}

function gerarCaixinhasParcelas(idNumParcelas, idContainer, idValorTotal, idEntrada) {
  const numParcelas = parseInt(document.getElementById(idNumParcelas).value) || 0;
  const container = document.getElementById(idContainer);
  container.innerHTML = "";
  if (numParcelas <= 0) return;
  const hoje = new Date();
  for (let i = 0; i < numParcelas; i++) {
    const d = new Date(hoje);
    d.setDate(d.getDate() + 30 * i);
    const iso = d.toISOString().slice(0, 10);
    const linha = document.createElement("div");
    linha.className = "linha-parcela";
    linha.style.display = "flex";
    linha.style.alignItems = "center";
    linha.style.gap = "10px";
    const label = document.createElement("label");
    label.style.margin = "0";
    label.style.minWidth = "150px";
    label.textContent = `Vencimento da parcela ${i + 1}`;
    const input = document.createElement("input");
    input.type = "date";
    input.name = "data_parcela";
    input.value = iso;
    input.style.width = "160px";
    input.addEventListener("change", () => _cascatearDatasParcelas(idContainer, i));
    const prefixoValor = document.createElement("span");
    prefixoValor.textContent = "R$";
    prefixoValor.style.color = "#777";
    prefixoValor.style.fontSize = "0.85rem";
    const inputValor = document.createElement("input");
    inputValor.type = "text";
    inputValor.name = "valor_parcela";
    inputValor.className = "valor-parcela-input";
    inputValor.style.width = "80px";
    inputValor.placeholder = "0,00";
    inputValor.title = "Valor desta parcela — vem dividido igual, mas pode ajustar (ex.: pra fechar certinho sem dízima); as parcelas seguintes recalculam sozinhas";
    inputValor.addEventListener("change", () => _cascatearValoresParcelas(idContainer, idValorTotal, idEntrada, i));
    linha.appendChild(label);
    linha.appendChild(input);
    linha.appendChild(prefixoValor);
    linha.appendChild(inputValor);
    container.appendChild(linha);
  }
  if (idValorTotal) atualizarValoresParcelas(idContainer, idValorTotal, idEntrada);
}

// ---------- Máscara de telefone brasileira: (XX) XXXXX-XXXX (ou XXXX-XXXX se fixo) ----------
function mascararTelefone(valorDigitado) {
  const digitos = (valorDigitado || "").replace(/\D/g, "").slice(0, 11);
  if (digitos.length === 0) return "";
  if (digitos.length <= 2) return `(${digitos}`;
  if (digitos.length <= 6) return `(${digitos.slice(0, 2)}) ${digitos.slice(2)}`;
  if (digitos.length <= 10) return `(${digitos.slice(0, 2)}) ${digitos.slice(2, 6)}-${digitos.slice(6)}`;
  return `(${digitos.slice(0, 2)}) ${digitos.slice(2, 7)}-${digitos.slice(7)}`;
}

function aplicarMascaraTelefone(idCampo) {
  const campo = document.getElementById(idCampo);
  if (!campo) return;
  campo.addEventListener("input", () => {
    campo.value = mascararTelefone(campo.value);
  });
}

// ---------- Normalização sem acento (mesmo critério do backend, _normalizar_texto
// em db.py) — usada pelo autocomplete de cliente/produto, pra digitar "Cecilia"
// sem acento e achar "Maria Cecília". ----------
function normalizarTexto(texto) {
  return (texto || "")
    .toString()
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .trim()
    .replace(/\s+/g, " ");
}

// ---------- Autocomplete "na mão" (dropdown simples abaixo do campo) — substitui
// o <datalist> nativo, que não dá pra ensinar a ignorar acento. Filtra por trecho,
// em qualquer parte do texto, sem acento. Se não achar nada, o campo continua
// editável livre (cliente novo / produto ainda não cadastrado). ----------
function configurarAutocomplete(cfg) {
  // cfg = { idCampo, idDropdown, itens, textoItem(item), textoBusca(item)?,
  //         rotuloItem(item)?, aoSelecionar(item)?, limite? }
  const campo = document.getElementById(cfg.idCampo);
  const dropdown = document.getElementById(cfg.idDropdown);
  if (!campo || !dropdown) return;
  const limite = cfg.limite || 30;

  function renderizar(encontrados) {
    dropdown.innerHTML = "";
    if (encontrados.length === 0) {
      dropdown.style.display = "none";
      return;
    }
    encontrados.slice(0, limite).forEach(item => {
      const opcao = document.createElement("div");
      opcao.className = "autocomplete-opcao";
      opcao.textContent = cfg.rotuloItem ? cfg.rotuloItem(item) : cfg.textoItem(item);
      // mousedown (não click) pra disparar antes do blur do campo esconder o dropdown
      opcao.addEventListener("mousedown", (ev) => {
        ev.preventDefault();
        campo.value = cfg.textoItem(item);
        dropdown.style.display = "none";
        if (cfg.aoSelecionar) cfg.aoSelecionar(item);
      });
      dropdown.appendChild(opcao);
    });
    dropdown.style.display = "block";
  }

  function filtrar() {
    const termo = normalizarTexto(campo.value);
    if (!termo) {
      dropdown.style.display = "none";
      return;
    }
    const encontrados = cfg.itens.filter(item =>
      normalizarTexto(cfg.textoBusca ? cfg.textoBusca(item) : cfg.textoItem(item)).includes(termo)
    );
    renderizar(encontrados);
  }

  campo.addEventListener("input", filtrar);
  campo.addEventListener("focus", filtrar);
  campo.addEventListener("blur", () => {
    // pequeno atraso pra dar tempo do mousedown na opção rodar antes do dropdown sumir
    setTimeout(() => { dropdown.style.display = "none"; }, 150);
  });
}

// ---------- Seletor de produto (autocomplete + cadastro rápido), usado em
// Nova venda, Nova compra e Editar compra. Recebe os ids dos elementos de cada
// tela e o array de produtos já embutido na página (cfg.itens). ----------
function formatarOpcaoProduto(p) {
  let texto = `${p.codigo} — ${p.nome}`;
  if (p.marca) texto += ` (${p.marca})`;
  if (p.numeracao) texto += ` — ${p.numeracao}`;
  return texto;
}

function inicializarSeletorProduto(cfg) {
  const campoProduto = document.getElementById(cfg.produto);
  const campoDescricao = document.getElementById(cfg.descricao);
  const campoValor = document.getElementById(cfg.valor);
  if (!campoProduto) return;

  function aplicarProduto(p) {
    const texto = formatarOpcaoProduto(p);
    campoProduto.value = texto;
    if (campoDescricao) campoDescricao.value = texto;
    if (p.preco_venda && campoValor) {
      campoValor.value = parseFloat(p.preco_venda).toFixed(2).replace(".", ",");
      campoValor.dispatchEvent(new Event("input", { bubbles: true }));
    }
  }

  // Enquanto o Thiago digita livre (produto ainda não selecionado/cadastrado),
  // a descrição continua espelhando o texto — só o valor não é mexido, porque
  // sem um produto selecionado não tem preço de catálogo pra sugerir.
  campoProduto.addEventListener("input", () => {
    if (campoDescricao) campoDescricao.value = campoProduto.value;
  });

  configurarAutocomplete({
    idCampo: cfg.produto,
    idDropdown: cfg.dropdown,
    itens: cfg.itens,
    textoItem: formatarOpcaoProduto,
    aoSelecionar: aplicarProduto,
  });

  // Cadastro rápido — só liga se a tela tiver o mini-formulário (nem toda tela precisa)
  if (!cfg.toggleNovo) return;
  const toggle = document.getElementById(cfg.toggleNovo);
  const formNovo = document.getElementById(cfg.formNovo);
  const msg = document.getElementById(cfg.msgNovo);
  const campoCodigoNovo = document.getElementById(cfg.codigoNovo);
  const campoNomeNovo = document.getElementById(cfg.nomeNovo);
  const campoMarcaNovo = document.getElementById(cfg.marcaNovo);
  const campoPrecoNovo = document.getElementById(cfg.precoNovo);

  toggle.addEventListener("click", () => {
    const abrir = formNovo.style.display === "none";
    formNovo.style.display = abrir ? "block" : "none";
    if (msg) msg.textContent = "";
    if (abrir) campoNomeNovo.focus();
  });

  document.getElementById(cfg.salvarNovo).addEventListener("click", async () => {
    const nome = campoNomeNovo.value.trim();
    if (!nome) {
      msg.textContent = "Nome do produto é obrigatório.";
      msg.style.color = "var(--carmim)";
      return;
    }
    const corpo = new URLSearchParams({
      codigo: campoCodigoNovo.value.trim(),
      nome: nome,
      marca: campoMarcaNovo.value.trim(),
      preco_venda: campoPrecoNovo.value.trim(),
    });
    msg.textContent = "Cadastrando...";
    msg.style.color = "#777";
    try {
      const resp = await fetch("/produtos/rapido", { method: "POST", body: corpo });
      const dados = await resp.json();
      if (!dados.ok) {
        msg.textContent = dados.erro || "Não consegui cadastrar o produto.";
        msg.style.color = "var(--carmim)";
        return;
      }
      const p = dados.produto;
      cfg.itens.push(p);
      aplicarProduto(p);
      campoCodigoNovo.value = "";
      campoNomeNovo.value = "";
      campoMarcaNovo.value = "";
      campoPrecoNovo.value = "";
      formNovo.style.display = "none";
      msg.textContent = `Produto ${p.codigo} cadastrado e já selecionado.`;
      msg.style.color = "#1F7A3E";
    } catch (e) {
      msg.textContent = "Erro de conexão ao cadastrar o produto.";
      msg.style.color = "var(--carmim)";
    }
  });
}

// ---------- Aviso (não bloqueante) de cliente com nome ou telefone já cadastrado ----------
async function buscarClientesDuplicados(nome, telefone) {
  const params = new URLSearchParams({ nome: nome || "", telefone: telefone || "" });
  try {
    const resp = await fetch("/clientes/verificar-duplicado?" + params.toString());
    if (!resp.ok) return [];
    const dados = await resp.json();
    return dados.duplicados || [];
  } catch (e) {
    return [];
  }
}

function _dataBr(iso) {
  if (!iso) return null;
  const partes = iso.split("-");
  if (partes.length !== 3) return iso;
  return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

// Só pra texto exibido (aviso de duplicidade) — nunca usar em campo de formulário,
// o ponto de milhar quebraria o parser do servidor (`.replace(",", ".")`).
function _moedaBr(valor) {
  return (valor || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function _linhaClienteDuplicado(d) {
  const saldo = _moedaBr(d.saldo_total);
  const ultima = _dataBr(d.ultima_compra) || "nunca comprou";
  return `- ${d.nome} — ${d.telefone || "sem telefone cadastrado"} — saldo em aberto: R$ ${saldo} — última compra: ${ultima}`;
}

function montarAvisoClienteDuplicado(duplicados) {
  const fortes = duplicados.filter(d => d.gravidade === "forte");
  const brandos = duplicados.filter(d => d.gravidade !== "forte");
  let texto = "";
  if (fortes.length > 0) {
    // Telefone repetido = sinal forte de ser a mesma pessoa — aviso destacado.
    texto += `⚠️ TELEFONE JÁ CADASTRADO — provavelmente a mesma pessoa:\n${fortes.map(_linhaClienteDuplicado).join("\n")}\n\n`;
  }
  if (brandos.length > 0) {
    texto += `Nome igual ou parecido já cadastrado (pode ser coincidência):\n${brandos.map(_linhaClienteDuplicado).join("\n")}\n\n`;
  }
  texto += "Continuar mesmo assim e cadastrar de novo?";
  return texto;
}
